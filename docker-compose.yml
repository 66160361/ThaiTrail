version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: thaitrail_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: thai_trail_db
      MYSQL_USER: thaitrail_user
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: thaitrail_backend
    restart: always
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: thai_trail_db
      DB_USER: thaitrail_user
      DB_PASS: password123
      APP_ENV: production
    ports:
      - "8000:80"
    depends_on:
      - database

volumes:
  db_data:
